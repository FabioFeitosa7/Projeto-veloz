name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  django-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r backend/requirements.txt

      - name: Verificar migrations
        run: python backend/manage.py makemigrations --check --dry-run --settings=config.settings_test

      - name: Executar verificações do Django
        run: python backend/manage.py check

      - name: Executar testes
        run: python backend/manage.py test estoque --settings=config.settings_test

  react-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar qualidade do código
        run: npm run lint

      - name: Executar testes
        run: npm run test

      - name: Gerar build de produção
        run: npm run build
